name: Review operator sources
on:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:sources
      - if: always()
        run: cat reports/source-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-review
          path: reports
          retention-days: 30
